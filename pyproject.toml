[project]
name = "unified-armory"
version = "0.1.0"
description = "Wear armor from any Halo MCC game in every MCC campaign: extracts, refits and re-imports the real models."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
unified-armory = "unified_armory.__main__:main"

[tool.setuptools]
packages = ["unified_armory", "unified_armory.porting"]

[tool.setuptools.package-data]
unified_armory = ["data/games/*.json", "web/*"]
